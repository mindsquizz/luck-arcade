<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AURA69 — Choose Your Luck</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 20%, #172d50 0%, #081323 42%, #02060c 100%);
  color: white;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* =========================
   APP
========================= */

.app {
  width: 100%;
  max-width: 520px;
  height: 100%;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* =========================
   OPENING
========================= */

#opening {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at center, rgba(212,175,55,.20), transparent 35%),
    radial-gradient(circle at 50% 60%, #122542 0%, #050c17 55%, #02050a 100%);
}

.opening-glow {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(212,175,55,.12);
  filter: blur(45px);
  animation: glowPulse 3s infinite alternate;
}

@keyframes glowPulse {
  from { transform: scale(.85); opacity: .45; }
  to { transform: scale(1.2); opacity: .9; }
}

.logo-opening {
  width: min(72vw, 330px);
  max-height: 180px;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 22px rgba(212,175,55,.35));
  animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.opening-subtitle {
  margin-top: 25px;
  color: #d8c27a;
  letter-spacing: 4px;
  font-size: 12px;
  position: relative;
  z-index: 2;
}

.play-btn {
  margin-top: 45px;
  position: relative;
  z-index: 2;

  border: 1px solid rgba(255,255,255,.35);
  border-radius: 50px;
  padding: 16px 55px;

  background: linear-gradient(135deg, #f1d36a, #b98b24);
  color: #111;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;

  box-shadow:
    0 0 30px rgba(212,175,55,.35),
    inset 0 1px rgba(255,255,255,.7);

  cursor: pointer;
}

.play-btn:active {
  transform: scale(.96);
}

/* =========================
   MAIN
========================= */

#main {
  width: 100%;
  height: 100%;
  padding: 22px 16px;
  overflow-y: auto;
  display: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-small {
  width: 105px;
  height: 45px;
  object-fit: contain;
}

.lang {
  border: 1px solid rgba(212,175,55,.4);
  background: rgba(10,20,35,.7);
  color: #d8c27a;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
}

.title {
  text-align: center;
  margin-top: 18px;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  color: #91a0b6;
  font-size: 13px;
  margin-top: 8px;
}

/* =========================
   CARDS
========================= */

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 25px;
}

.choice {
  position: relative;
  height: 245px;
  border-radius: 20px;
  overflow: hidden;

  border: 1px solid rgba(212,175,55,.30);

  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.3)),
    rgba(7,16,28,.85);

  box-shadow:
    0 12px 30px rgba(0,0,0,.35),
    inset 0 0 30px rgba(212,175,55,.04);

  cursor: pointer;
  transition: .25s ease;
}

.choice:hover {
  transform: translateY(-4px);
}

.choice:active {
  transform: scale(.97);
}

.choice img {
  width: 100%;
  height: 190px;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 8px 15px rgba(0,0,0,.45));
}

.choice-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

  padding: 13px 8px;

  text-align: center;
  font-weight: bold;
  font-size: 15px;

  background: linear-gradient(
    180deg,
    transparent,
    rgba(0,0,0,.85)
  );

  color: #f4df91;
}

/* Make third card centered */

.choice:nth-child(3) {
  grid-column: 1 / 3;
  width: 58%;
  margin: 0 auto;
}

/* =========================
   REVEAL
========================= */

#reveal {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;

  justify-content: center;
  align-items: center;
  flex-direction: column;

  background:
    radial-gradient(circle at center,
      rgba(212,175,55,.22),
      rgba(4,10,18,.96) 48%,
      #02050a 100%);
}

.reveal-ring {
  position: absolute;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  border: 1px solid rgba(212,175,55,.45);
  box-shadow:
    0 0 30px rgba(212,175,55,.25),
    inset 0 0 30px rgba(212,175,55,.12);

  animation: ringPulse 1.5s infinite;
}

@keyframes ringPulse {
  0% {
    transform: scale(.65);
    opacity: 0;
  }
  40% {
    opacity: 1;
  }
  100% {
    transform: scale(1.5);
    opacity: 0;
  }
}

.reveal-text {
  z-index: 2;
  color: #d8c27a;
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.reveal-img {
  z-index: 2;
  width: 280px;
  height: 280px;
  object-fit: contain;

  filter:
    drop-shadow(0 0 30px rgba(212,175,55,.55));

  animation: revealCharacter 1.5s ease forwards;
}

@keyframes revealCharacter {
  0% {
    transform: scale(.15) rotate(-10deg);
    opacity: 0;
  }
  60% {
    transform: scale(1.12) rotate(3deg);
    opacity: 1;
  }
  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

/* =========================
   RESULT
========================= */

#result {
  position: absolute;
  inset: 0;
  z-index: 80;
  display: none;

  overflow-y: auto;

  padding: 35px 20px 30px;

  background:
    radial-gradient(circle at 50% 20%,
      rgba(212,175,55,.22),
      transparent 35%),
    linear-gradient(180deg, #071426, #02060c 75%);
}

.result-inner {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.result-small {
  color: #d8c27a;
  letter-spacing: 3px;
  font-size: 11px;
  margin-top: 8px;
}

.result-title {
  font-size: 28px;
  line-height: 1.25;
  margin: 13px 0 8px;

  background: linear-gradient(
    90deg,
    #fff,
    #f0d36b,
    #fff
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.result-img {
  width: 230px;
  height: 230px;
  object-fit: contain;

  margin: 5px 0 0;

  filter:
    drop-shadow(0 0 25px rgba(212,175,55,.45));

  animation: resultFloat 3s ease-in-out infinite;
}

@keyframes resultFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.result-character {
  color: #f0d36b;
  font-size: 22px;
  font-weight: bold;
  margin-top: -3px;
}

.fortune-box {
  width: 100%;
  max-width: 420px;

  margin-top: 18px;
  padding: 22px 18px;

  border-radius: 20px;

  background:
    linear-gradient(
      135deg,
      rgba(212,175,55,.10),
      rgba(255,255,255,.025)
    );

  border: 1px solid rgba(212,175,55,.28);

  box-shadow:
    0 15px 40px rgba(0,0,0,.35),
    inset 0 0 25px rgba(212,175,55,.04);
}

.fortune-label {
  color: #9daabd;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.fortune-text {
  font-size: 17px;
  line-height: 1.65;
  color: #f6f2e8;
}

.aura-cta {
  width: 100%;
  max-width: 420px;

  margin-top: 18px;

  padding: 16px 20px;

  border-radius: 50px;
  border: 1px solid rgba(255,255,255,.35);

  background:
    linear-gradient(135deg, #f1d36a, #b88720);

  color: #111;
  font-size: 15px;
  font-weight: bold;

  box-shadow:
    0 0 30px rgba(212,175,55,.25);

  cursor: pointer;
}

.aura-cta:active {
  transform: scale(.97);
}

.again-btn {
  margin-top: 12px;

  border: 1px solid rgba(212,175,55,.30);
  background: rgba(10,20,35,.7);
  color: #d8c27a;

  padding: 13px 25px;
  border-radius: 50px;

  font-size: 13px;
  cursor: pointer;
}

.disclaimer {
  margin-top: 16px;
  max-width: 390px;

  color: #66758b;
  font-size: 10px;
  line-height: 1.5;
}

/* =========================
   DAILY FORTUNE
========================= */

.daily-status {
  text-align: center;
  min-height: 18px;
  margin-top: 12px;
  color: #d8c27a;
  font-size: 11px;
  letter-spacing: .4px;
  text-shadow: 0 0 12px rgba(212,175,55,.16);
}

.choice.locked {
  opacity: .45;
  filter: saturate(.65);
  cursor: default;
  pointer-events: none;
}

.choice.locked::after {
  content: "✓ TODAY'S LUCK";
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 5px 8px;
  border-radius: 12px;
  background: rgba(212,175,55,.14);
  border: 1px solid rgba(212,175,55,.32);
  color: #d8c27a;
  font-size: 9px;
  letter-spacing: 1px;
}

/* =========================
   PARTICLES
========================= */

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #e8c75b;

  box-shadow: 0 0 8px #e8c75b;

  pointer-events: none;

  animation: particleMove 2s linear forwards;
}

@keyframes particleMove {
  0% {
    transform: translate(0,0) scale(.5);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    transform: translate(
      calc((var(--x) - .5) * 500px),
      calc((var(--y) - .5) * 700px)
    ) scale(0);
    opacity: 0;
  }
}

@media (max-height: 700px) {
  .choice {
    height: 205px;
  }

  .choice img {
    height: 155px;
  }

  .result-img {
    width: 190px;
    height: 190px;
  }
}

/* =========================
   LUXURY RESULT POLISH
   Layout intentionally unchanged
========================= */

#result {
  background:
    radial-gradient(circle at 50% 16%,
      rgba(212,175,55,.26),
      transparent 34%),
    radial-gradient(circle at 50% 48%,
      rgba(212,175,55,.055),
      transparent 52%),
    linear-gradient(180deg, #071426, #02060c 75%);
}

.result-inner {
  position: relative;
}

.result-small {
  text-shadow: 0 0 14px rgba(212,175,55,.20);
  animation: resultFadeUp .65s ease both;
}

.result-title {
  text-shadow:
    0 0 18px rgba(212,175,55,.20),
    0 0 35px rgba(212,175,55,.08);
  animation: resultTitleReveal .8s .08s ease both;
}

.result-img {
  filter:
    drop-shadow(0 0 28px rgba(212,175,55,.55))
    drop-shadow(0 12px 20px rgba(0,0,0,.42));
  animation:
    resultFloat 3s ease-in-out infinite,
    resultImageReveal .9s .16s ease both;
}

.result-character {
  text-shadow:
    0 0 12px rgba(240,211,107,.28),
    0 0 26px rgba(212,175,55,.12);
  animation: resultFadeUp .7s .22s ease both;
}

.fortune-box {
  background:
    linear-gradient(
      135deg,
      rgba(212,175,55,.13),
      rgba(255,255,255,.028)
    );
  box-shadow:
    0 18px 45px rgba(0,0,0,.38),
    0 0 28px rgba(212,175,55,.055),
    inset 0 0 25px rgba(212,175,55,.055);
  animation: resultFadeUp .75s .28s ease both;
}

.fortune-label {
  text-shadow: 0 0 10px rgba(212,175,55,.12);
}

.fortune-text {
  text-shadow: 0 1px 12px rgba(0,0,0,.25);
}

.aura-cta {
  box-shadow:
    0 0 30px rgba(212,175,55,.30),
    0 10px 30px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.7);
  animation:
    resultFadeUp .75s .36s ease both,
    ctaGlow 2.8s 1.1s ease-in-out infinite;
}

.again-btn {
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
  animation: resultFadeUp .75s .42s ease both;
}

.disclaimer {
  animation: resultFadeUp .75s .48s ease both;
}

@keyframes resultFadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes resultTitleReveal {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.985);
    filter: blur(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes resultImageReveal {
  from {
    opacity: 0;
    transform: scale(.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes ctaGlow {
  0%, 100% {
    box-shadow:
      0 0 30px rgba(212,175,55,.26),
      0 10px 30px rgba(0,0,0,.28),
      inset 0 1px rgba(255,255,255,.7);
  }
  50% {
    box-shadow:
      0 0 42px rgba(212,175,55,.40),
      0 10px 30px rgba(0,0,0,.28),
      inset 0 1px rgba(255,255,255,.8);
  }
}

@media (prefers-reduced-motion: reduce) {
  .result-small,
  .result-title,
  .result-img,
  .result-character,
  .fortune-box,
  .aura-cta,
  .again-btn,
  .disclaimer {
    animation: none;
  }
}

</style>
</head>

/* ==================================================
   DAILY STORAGE
================================================== */

const DAILY_STORAGE_KEY = "aura69_daily_fortune_v2";
let selected = null;
let dailyRecord = null;
let currentFortune = null;

function todayKey() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function loadDailyRecord() {
  try {
    const raw = localStorage.getItem(DAILY_STORAGE_KEY);
    if (!raw) return null;

    const record = JSON.parse(raw);

    if (
      record &&
      record.date === todayKey() &&
      fortunePools[record.type] &&
      Number.isInteger(record.index) &&
      fortunePools[record.type][record.index]
    ) {
      return record;
    }

    return null;
  } catch (e) {
    return null;
  }
}

function saveDailyRecord(record) {
  dailyRecord = record;

  try {
    localStorage.setItem(
      DAILY_STORAGE_KEY,
      JSON.stringify(record)
    );
  } catch (e) {}
}

function getStoredFortune(record) {
  if (!record || !fortunePools[record.type]) return null;
  return fortunePools[record.type][record.index] || null;
}

function hasPlayedToday() {
  return !!dailyRecord && dailyRecord.date === todayKey();
}

/* ==================================================
   AUDIO
================================================== */

let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx =
      new (window.AudioContext ||
           window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function tone(
  frequency,
  duration,
  type = "sine",
  volume = 0.04
) {
  if (!soundEnabled) return;

  initAudio();

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.type = type;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime + duration
  );
}

function tapSound() {
  tone(500, .08, "sine", .035);
}

function revealSound() {
  tone(350, .18, "sine", .035);

  setTimeout(() => {
    tone(500, .18, "sine", .035);
  }, 120);

  setTimeout(() => {
    tone(760, .35, "sine", .055);
  }, 240);
}

/* ==================================================
   HAPTICS
================================================== */

function vibrate(pattern) {
  if (
    navigator.vibrate &&
    window.Telegram &&
    window.Telegram.WebApp
  ) {
    try {
      navigator.vibrate(pattern);
    } catch(e) {}
  }
}

/* ==================================================
   OPEN GAME
================================================== */

function startGame() {
  initAudio();
  tapSound();

  document
    .getElementById("opening")
    .style.display = "none";

  document
    .getElementById("main")
    .style.display = "block";

  dailyRecord = loadDailyRecord();

  if (hasPlayedToday()) {
    updateDailyStatus();

    setTimeout(() => {
      showResult(
        dailyRecord.type,
        getStoredFortune(dailyRecord)
      );
    }, 120);
  } else {
    updateDailyStatus();
  }
}

/* ==================================================
   CHOOSE
================================================== */

function choose(type) {
  if (hasPlayedToday()) {
    showResult(
      dailyRecord.type,
      getStoredFortune(dailyRecord)
    );
    return;
  }

  selected = type;

  const pool = fortunePools[type];
  const index = Math.floor(Math.random() * pool.length);
  const fortune = pool[index];

  /* Save immediately so double-taps cannot create
     a second result during the reveal animation. */
  saveDailyRecord({
    date: todayKey(),
    type: type,
    index: index
  });

  currentFortune = fortune;

  initAudio();
  tapSound();
  vibrate(25);

  const reveal =
    document.getElementById("reveal");

  const revealImg =
    document.getElementById("revealImg");

  const revealText =
    document.getElementById("revealText");

  const imageMap = {
    dragon: "dragon.png",
    qilin: "qilin.png",
    toad: "toad.png"
  };

  revealImg.src =
    imageMap[type];

  revealText.textContent =
    translations[language].reveal;

  reveal.style.display =
    "flex";

  createParticles();

  setTimeout(() => {
    revealSound();
    vibrate([30, 40, 70]);
  }, 700);

  setTimeout(() => {
    showResult(type, fortune);
  }, 2100);
}

/* ==================================================
   RESULT
================================================== */

function showResult(type, fortune = null) {
  const reveal =
    document.getElementById("reveal");

  reveal.style.display =
    "none";

  const result =
    document.getElementById("result");

  const resultImg =
    document.getElementById("resultImg");

  const imageMap = {
    dragon: "dragon.png",
    qilin: "qilin.png",
    toad: "toad.png"
  };

  selected = type;
  currentFortune =
    fortune ||
    getStoredFortune(dailyRecord) ||
    fortunePools[type][0];

  resultImg.src =
    imageMap[type];

  updateResultText(type);

  result.style.display =
    "block";

  updateDailyStatus();
}

/* ==================================================
   RESULT TEXT
================================================== */

function updateResultText(type) {
  const t =
    translations[language];

  document
    .getElementById("resultTitle")
    .textContent =
      t.resultTitle;

  document
    .getElementById("fortuneLabel")
    .textContent =
      t.fortuneLabel;

  document
    .getElementById("auraCTA")
    .textContent =
      t.auraCTA;

  document
    .getElementById("againBtn")
    .textContent =
      hasPlayedToday()
        ? t.againLocked
        : t.again;

  document
    .getElementById("disclaimer")
    .textContent =
      t.disclaimer;

  let character = "";

  if (type === "dragon") {
    character = t.dragonName;
  }

  if (type === "qilin") {
    character = t.qilinName;
  }

  if (type === "toad") {
    character = t.toadName;
  }

  document
    .getElementById("resultCharacter")
    .textContent =
      character;

  const fortuneText =
    currentFortune
      ? currentFortune[language]
      : "";

  document
    .getElementById("fortuneText")
    .textContent =
      fortuneText;
}

/* ==================================================
   DAILY STATUS
================================================== */

function updateDailyStatus() {
  const status =
    document.getElementById("dailyStatus");

  if (!status) return;

  const t =
    translations[language];

  status.textContent =
    hasPlayedToday()
      ? t.dailyPlayed
      : t.dailyReady;

  document
    .querySelectorAll(".choice")
    .forEach(card => {
      if (hasPlayedToday()) {
        card.classList.add("locked");
      } else {
        card.classList.remove("locked");
      }
    });
}

================================================== */

function toggleLanguage() {
  language =
    language === "th"
      ? "en"
      : "th";

  const t =
    translations[language];

  document
    .getElementById("langButton")
    .textContent =
      language === "th"
        ? "EN"
        : "ไทย";

  document
    .getElementById("title")
    .textContent =
      t.title;

  document
    .getElementById("subtitle")
    .textContent =
      t.subtitle;

  document
    .getElementById("dragonName")
    .textContent =

  document
    .getElementById("qilinName")
    .textContent =
      t.qilinName;

  document
    .getElementById("toadName")
    .textContent =
      t.toadName;

  updateDailyStatus();

  if (selected) {
    updateResultText(selected);
  }
}

      language === "th"

        : "You have already revealed today's luck ✨\nCome back tomorrow."
    );

    return;
  }

  document
    .getElementById("result")
    .style.display = "none";

  document
    .getElementById("main")
    .style.display = "block";

  selected = null;
  currentFortune = null;
  updateDailyStatus();
}

function auraCTA() {

    window.open(
      AURA69_URL,
      "_blank"
    );
  }
}

/* ==================================================
   PARTICLES
================================================== */

function createParticles() {
  const reveal =
    document.getElementById("reveal");

  for (let i = 0; i < 28; i++) {
    const p =
      document.createElement("div");

    p.className =
      "particle";

    p.style.left =
      (Math.random() * 100) + "%";

    p.style.top =
      (Math.random() * 100) + "%";

    p.style.setProperty(
      "--x",
      Math.random()
    );

    p.style.setProperty(
      "--y",
      Math.random()
    );

    p.style.animationDelay =
      (Math.random() * .8) + "s";

    reveal.appendChild(p);

    setTimeout(() => {
      p.remove();
    }, 2800);
  }
}
