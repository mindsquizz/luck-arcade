<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AURA69 — Choose Your Luck</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 20%, #172d50 0%, #081323 42%, #02060c 100%);
  color: white;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* =========================
   APP
========================= */

.app {
  width: 100%;
  max-width: 520px;
  height: 100%;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* =========================
   OPENING
========================= */

#opening {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at center, rgba(212,175,55,.20), transparent 35%),
    radial-gradient(circle at 50% 60%, #122542 0%, #050c17 55%, #02050a 100%);
}

.opening-glow {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(212,175,55,.12);
  filter: blur(45px);
  animation: glowPulse 3s infinite alternate;
}

@keyframes glowPulse {
  from { transform: scale(.85); opacity: .45; }
  to { transform: scale(1.2); opacity: .9; }
}

.logo-opening {
  width: min(72vw, 330px);
  max-height: 180px;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 22px rgba(212,175,55,.35));
  animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.opening-subtitle {
  margin-top: 25px;
  color: #d8c27a;
  letter-spacing: 4px;
  font-size: 12px;
  position: relative;
  z-index: 2;
}

.opening-lang {
  margin-top: 24px;
  position: relative;
  z-index: 2;
  border: 1px solid rgba(212,175,55,.55);
  border-radius: 999px;
  padding: 8px 18px;
  background: rgba(2,8,16,.45);
  color: #f1d36a;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 16px rgba(212,175,55,.10);
  transition: .2s ease;
}

.opening-lang:hover {
  transform: translateY(-1px);
  border-color: rgba(241,211,106,.9);
  box-shadow: 0 0 22px rgba(212,175,55,.18);
}

.opening-lang:active {
  transform: scale(.97);
}

.play-btn {
  margin-top: 45px;
  position: relative;
  z-index: 2;

  border: 1px solid rgba(255,255,255,.35);
  border-radius: 50px;
  padding: 16px 55px;

  background: linear-gradient(135deg, #f1d36a, #b98b24);
  color: #111;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;

  box-shadow:
    0 0 30px rgba(212,175,55,.35),
    inset 0 1px rgba(255,255,255,.7);

  cursor: pointer;
}

.play-btn:active {
  transform: scale(.96);
}

/* =========================
   MAIN
========================= */

#main {
  width: 100%;
  height: 100%;
  padding: 22px 16px;
  overflow-y: auto;
  display: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-small {
  width: 105px;
  height: 45px;
  object-fit: contain;
}

.lang {
  border: 1px solid rgba(212,175,55,.4);
  background: rgba(10,20,35,.7);
  color: #d8c27a;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
}

.title {
  text-align: center;
  margin-top: 18px;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  color: #91a0b6;
  font-size: 13px;
  margin-top: 8px;
}

/* =========================
   CARDS
========================= */

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 25px;
}

.choice {
  position: relative;
  height: 245px;
  border-radius: 20px;
  overflow: hidden;

  border: 1px solid rgba(212,175,55,.30);

  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.3)),
    rgba(7,16,28,.85);

  box-shadow:
    0 12px 30px rgba(0,0,0,.35),
    inset 0 0 30px rgba(212,175,55,.04);

  cursor: pointer;
  transition: .25s ease;
}

.choice:hover {
  transform: translateY(-4px);
}

.choice:active {
  transform: scale(.97);
}

.choice img {
  width: 100%;
  height: 190px;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 8px 15px rgba(0,0,0,.45));
}

.choice-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

  padding: 13px 8px;

  text-align: center;
  font-weight: bold;
  font-size: 15px;

  background: linear-gradient(
    180deg,
    transparent,
    rgba(0,0,0,.85)
  );

  color: #f4df91;
}

/* Make third card centered */

.choice:nth-child(3) {
  grid-column: 1 / 3;
  width: 58%;
  margin: 0 auto;
}

/* =========================
   REVEAL
========================= */

#reveal {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;

  justify-content: center;
  align-items: center;
  flex-direction: column;

  background:
    radial-gradient(circle at center,
      rgba(212,175,55,.22),
      rgba(4,10,18,.96) 48%,
      #02050a 100%);
}

.reveal-ring {
  position: absolute;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  border: 1px solid rgba(212,175,55,.45);
  box-shadow:
    0 0 30px rgba(212,175,55,.25),
    inset 0 0 30px rgba(212,175,55,.12);

  animation: ringPulse 1.5s infinite;
}

@keyframes ringPulse {
  0% {
    transform: scale(.65);
    opacity: 0;
  }
  40% {
    opacity: 1;
  }
  100% {
    transform: scale(1.5);
    opacity: 0;
  }
}

.reveal-text {
  z-index: 2;
  color: #d8c27a;
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.reveal-img {
  z-index: 2;
  width: 280px;
  height: 280px;
  object-fit: contain;

  filter:
    drop-shadow(0 0 30px rgba(212,175,55,.55));

  animation: revealCharacter 1.5s ease forwards;
}

@keyframes revealCharacter {
  0% {
    transform: scale(.15) rotate(-10deg);
    opacity: 0;
  }
  60% {
    transform: scale(1.12) rotate(3deg);
    opacity: 1;
  }
  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

/* =========================
   RESULT
========================= */

#result {
  position: absolute;
  inset: 0;
  z-index: 80;
  display: none;

  overflow-y: auto;

  padding: 35px 20px 30px;

  background:
    radial-gradient(circle at 50% 20%,
      rgba(212,175,55,.22),
      transparent 35%),
    linear-gradient(180deg, #071426, #02060c 75%);
}

.result-inner {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.result-small {
  color: #d8c27a;
  letter-spacing: 3px;
  font-size: 11px;
  margin-top: 8px;
}

.result-title {
  font-size: 28px;
  line-height: 1.25;
  margin: 13px 0 8px;

  background: linear-gradient(
    90deg,
    #fff,
    #f0d36b,
    #fff
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.result-img {
  width: 230px;
  height: 230px;
  object-fit: contain;

  margin: 5px 0 0;

  filter:
    drop-shadow(0 0 25px rgba(212,175,55,.45));

  animation: resultFloat 3s ease-in-out infinite;
}

@keyframes resultFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.result-character {
  color: #f0d36b;
  font-size: 22px;
  font-weight: bold;
  margin-top: -3px;
}

.fortune-box {
  width: 100%;
  max-width: 420px;

  margin-top: 18px;
  padding: 22px 18px;

  border-radius: 20px;

  background:
    linear-gradient(
      135deg,
      rgba(212,175,55,.10),
      rgba(255,255,255,.025)
    );

  border: 1px solid rgba(212,175,55,.28);

  box-shadow:
    0 15px 40px rgba(0,0,0,.35),
    inset 0 0 25px rgba(212,175,55,.04);
}

.fortune-label {
  color: #9daabd;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.fortune-text {
  font-size: 17px;
  line-height: 1.65;
  color: #f6f2e8;
}

.aura-cta {
  width: 100%;
  max-width: 420px;

  margin-top: 18px;

  padding: 16px 20px;

  border-radius: 50px;
  border: 1px solid rgba(255,255,255,.35);

  background:
    linear-gradient(135deg, #f1d36a, #b88720);

  color: #111;
  font-size: 15px;
  font-weight: bold;

  box-shadow:
    0 0 30px rgba(212,175,55,.25);

  cursor: pointer;
}

.aura-cta:active {
  transform: scale(.97);
}

.aura-share {
  width: 100%;
  max-width: 420px;
  margin-top: 12px;
  padding: 14px 20px;
  border-radius: 50px;
  border: 1px solid rgba(212,175,55,.34);
  background: rgba(10,20,35,.78);
  color: #e5d18b;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: .04em;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
  cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.aura-share:hover {
  border-color: rgba(212,175,55,.65);
  box-shadow: 0 10px 30px rgba(0,0,0,.28), 0 0 18px rgba(212,175,55,.10);
}
.aura-share:active { transform: scale(.97); }

.again-btn {
  margin-top: 12px;

  border: 1px solid rgba(212,175,55,.30);
  background: rgba(10,20,35,.7);
  color: #d8c27a;

  padding: 13px 25px;
  border-radius: 50px;

  font-size: 13px;
  cursor: pointer;
}

.disclaimer {
  margin-top: 16px;
  max-width: 390px;

  color: #66758b;
  font-size: 10px;
  line-height: 1.5;
}

/* =========================
   PARTICLES
========================= */

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #e8c75b;

  box-shadow: 0 0 8px #e8c75b;

  pointer-events: none;

  animation: particleMove 2s linear forwards;
}

@keyframes particleMove {
  0% {
    transform: translate(0,0) scale(.5);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    transform: translate(
      calc((var(--x) - .5) * 500px),
      calc((var(--y) - .5) * 700px)
    ) scale(0);
    opacity: 0;
  }
}

@media (max-height: 700px) {
  .choice {
    height: 205px;
  }

  .choice img {
    height: 155px;
  }

  .result-img {
    width: 190px;
    height: 190px;
  }
}

/* =========================
   LUXURY RESULT POLISH
   Layout intentionally unchanged
========================= */

#result {
  background:
    radial-gradient(circle at 50% 16%,
      rgba(212,175,55,.26),
      transparent 34%),
    radial-gradient(circle at 50% 48%,
      rgba(212,175,55,.055),
      transparent 52%),
    linear-gradient(180deg, #071426, #02060c 75%);
}

.result-inner {
  position: relative;
}

.result-small {
  text-shadow: 0 0 14px rgba(212,175,55,.20);
  animation: resultFadeUp .65s ease both;
}

.result-title {
  text-shadow:
    0 0 18px rgba(212,175,55,.20),
    0 0 35px rgba(212,175,55,.08);
  animation: resultTitleReveal .8s .08s ease both;
}

.result-img {
  filter:
    drop-shadow(0 0 28px rgba(212,175,55,.55))
    drop-shadow(0 12px 20px rgba(0,0,0,.42));
  animation:
    resultFloat 3s ease-in-out infinite,
    resultImageReveal .9s .16s ease both;
}

.result-character {
  text-shadow:
    0 0 12px rgba(240,211,107,.28),
    0 0 26px rgba(212,175,55,.12);
  animation: resultFadeUp .7s .22s ease both;
}

.fortune-box {
  background:
    linear-gradient(
      135deg,
      rgba(212,175,55,.13),
      rgba(255,255,255,.028)
    );
  box-shadow:
    0 18px 45px rgba(0,0,0,.38),
    0 0 28px rgba(212,175,55,.055),
    inset 0 0 25px rgba(212,175,55,.055);
  animation: resultFadeUp .75s .28s ease both;
}

.fortune-label {
  text-shadow: 0 0 10px rgba(212,175,55,.12);
}

.fortune-text {
  text-shadow: 0 1px 12px rgba(0,0,0,.25);
}

.aura-cta {
  box-shadow:
    0 0 30px rgba(212,175,55,.30),
    0 10px 30px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.7);
  animation:
    resultFadeUp .75s .36s ease both,
    ctaGlow 2.8s 1.1s ease-in-out infinite;
}

.again-btn {
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
  animation: resultFadeUp .75s .42s ease both;
}

.disclaimer {
  animation: resultFadeUp .75s .48s ease both;
}

@keyframes resultFadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes resultTitleReveal {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.985);
    filter: blur(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes resultImageReveal {
  from {
    opacity: 0;
    transform: scale(.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes ctaGlow {
  0%, 100% {
    box-shadow:
      0 0 30px rgba(212,175,55,.26),
      0 10px 30px rgba(0,0,0,.28),
      inset 0 1px rgba(255,255,255,.7);
  }
  50% {
    box-shadow:
      0 0 42px rgba(212,175,55,.40),
      0 10px 30px rgba(0,0,0,.28),
      inset 0 1px rgba(255,255,255,.8);
  }
}

@media (prefers-reduced-motion: reduce) {
  .result-small,
  .result-title,
  .result-img,
  .result-character,
  .fortune-box,
  .aura-cta,
  .aura-share,
  .again-btn,
  .disclaimer {
    animation: none;
  }
}


/* =========================
   AURA69 CUSTOM POPUP
   Replaces browser alert()
========================= */
.aura-popup-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0, 4, 10, .76);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.aura-popup-overlay.show {
  display: flex;
  animation: auraPopupFade .22s ease both;
}

.aura-popup {
  width: min(100%, 390px);
  position: relative;
  padding: 28px 24px 22px;
  border: 1px solid rgba(212,175,55,.55);
  border-radius: 22px;
  background:
    radial-gradient(circle at 50% 0%, rgba(212,175,55,.16), transparent 48%),
    linear-gradient(145deg, rgba(18,37,66,.98), rgba(3,9,18,.99));
  box-shadow:
    0 24px 70px rgba(0,0,0,.62),
    0 0 38px rgba(212,175,55,.16),
    inset 0 1px rgba(255,255,255,.10);
  text-align: center;
  transform: translateY(8px) scale(.97);
  animation: auraPopupIn .28s cubic-bezier(.2,.8,.2,1) both;
}

.aura-popup::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(212,175,55,.10);
  border-radius: 17px;
  pointer-events: none;
}

.aura-popup-logo {
  width: 88px;
  height: 44px;
  object-fit: contain;
  margin: 0 auto 8px;
  filter: drop-shadow(0 0 14px rgba(212,175,55,.28));
}

.aura-popup-brand {
  color: #d8c27a;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 13px;
}

.aura-popup-message {
  color: #fff;
  font-size: 16px;
  line-height: 1.65;
  white-space: pre-line;
  text-shadow: 0 1px 10px rgba(0,0,0,.25);
}

.aura-popup-ok {
  width: 100%;
  margin-top: 22px;
  padding: 13px 20px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 999px;
  background: linear-gradient(135deg, #f1d36a, #b98b24);
  color: #111;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 0 24px rgba(212,175,55,.28),
    inset 0 1px rgba(255,255,255,.7);
  transition: transform .16s ease, filter .16s ease;
}

.aura-popup-ok:active {
  transform: scale(.98);
  filter: brightness(.94);
}

@keyframes auraPopupFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes auraPopupIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .aura-popup-overlay,
  .aura-popup {
    animation: none;
  }
}

</style>
</head>

<body>

<div class="app">

  <!-- =====================
       AURA69 CUSTOM POPUP
       Replaces browser alert()
  ====================== -->
  <div
    id="auraPopup"
    class="aura-popup-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="auraPopupBrand"
    onclick="closeAuraPopup(event)"
  >
    <div class="aura-popup" onclick="event.stopPropagation()">
      <img src="aura69.png" class="aura-popup-logo" alt="AURA69">
      <div class="aura-popup-brand" id="auraPopupBrand">AURA69</div>
      <div class="aura-popup-message" id="auraPopupMessage"></div>
      <button
        type="button"
        class="aura-popup-ok"
        id="auraPopupOk"
        onclick="closeAuraPopup()"
      >
        OK
      </button>
    </div>
  </div>


  <!-- =====================
       OPENING
  ====================== -->

  <section id="opening">

    <div class="opening-glow"></div>

    <img
      src="aura69.png"
      class="logo-opening"
      alt="AURA69"
    >

    <div class="opening-subtitle" id="openingSubtitle">
      YOUR LUCK. YOUR CHOICE.
    </div>

    <button
      class="opening-lang"
      onclick="toggleLanguage()"
      id="openingLangButton"
      aria-label="Change language"
    >
      EN
    </button>

    <button class="play-btn" onclick="startGame()" id="playButton">
      PLAY
    </button>

  </section>


  <!-- =====================
       MAIN GAME
  ====================== -->

  <main id="main">

    <div class="topbar">

      <img
        src="aura69.png"
        class="logo-small"
        alt="AURA69"
      >

      <button
        class="lang"
        onclick="toggleLanguage()"
        id="langButton"
      >
        EN
      </button>

    </div>

    <div class="title" id="title">
      เลือกโชคของคุณ
    </div>

    <div class="subtitle" id="subtitle">
      เลือกหนึ่งสัญลักษณ์ แล้วเปิดโชคของคุณ
    </div>


    <div class="choices">

      <div class="choice" onclick="choose('dragon')">
        <img src="dragon.png" alt="Dragon">
        <div class="choice-name" id="dragonName">
          🐉 มังกร
        </div>
      </div>


      <div class="choice" onclick="choose('qilin')">
        <img src="qilin.png" alt="Qilin">
        <div class="choice-name" id="qilinName">
          🦌 กิเลน
        </div>
      </div>


      <div class="choice" onclick="choose('toad')">
        <img src="toad.png" alt="Golden Toad">
        <div class="choice-name" id="toadName">
          🐸 คางคกทอง
        </div>
      </div>

    </div>

  </main>


  <!-- =====================
       CINEMATIC REVEAL
  ====================== -->

  <section id="reveal">

    <div class="reveal-ring"></div>

    <div class="reveal-text" id="revealText">
      กำลังเปิดโชคของคุณ...
    </div>

    <img
      id="revealImg"
      class="reveal-img"
      src=""
      alt=""
    >

  </section>


  <!-- =====================
       RESULT
  ====================== -->

  <section id="result">

    <div class="result-inner">

      <div class="result-small">
        AURA69 • YOUR LUCK
      </div>

      <div class="result-title" id="resultTitle">
        ✨ โชคของคุณถูกเปิดแล้ว ✨
      </div>

      <img
        id="resultImg"
        class="result-img"
        src=""
        alt=""
      >

      <div
        class="result-character"
        id="resultCharacter"
      >
      </div>

      <div class="fortune-box">

        <div class="fortune-label" id="fortuneLabel">
          คำทำนายของคุณ

/* ==================================================
   AUDIO
================================================== */

let audioCtx = null;
let soundEnabled = true;


function initAudio() {

  if (!audioCtx) {
    audioCtx =
      new (window.AudioContext ||
           window.webkitAudioContext)();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}


function tone(
  frequency,
  duration,
  type = "sine",
  volume = 0.04
) {

  if (!soundEnabled) return;

  initAudio();

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.type = type;

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime + duration
  );
}


function tapSound() {
  tone(500, .08, "sine", .035);
}


function revealSound() {

  tone(350, .18, "sine", .035);

  setTimeout(() => {
    tone(500, .18, "sine", .035);
  }, 120);

  setTimeout(() => {
    tone(760, .35, "sine", .055);
  }, 240);

}

function createParticles() {

      document.createElement("div");

    p.className =
      "particle";


    p.style.left =
      (Math.random() * 100) + "%";


    p.style.top =
      (Math.random() * 100) + "%";


    p.style.setProperty(
      "--x",
      Math.random()
    );


    p.style.setProperty(
      "--y",
      Math.random()
    );


    p.style.animationDelay =
      (Math.random() * .8) + "s";


    reveal.appendChild(p);


    setTimeout(() => {

      p.remove();

    }, 2800);

  }
