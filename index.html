<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AURA69 — Choose Your Luck</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #020611;
    color: white;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

/* =========================
   LANGUAGE
========================= */

.language {
    position: fixed;
    top: 18px;
    right: 15px;
    z-index: 500;

    display: flex;
    gap: 4px;

    padding: 4px;

    border-radius: 20px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(212,167,67,.25);

    backdrop-filter: blur(10px);
}

.language button {
    border: 0;
    background: transparent;

    color: rgba(255,255,255,.55);

    padding: 6px 10px;
    border-radius: 14px;

    font-size: 11px;
    font-weight: bold;
}

.language button.active {
    background: linear-gradient(135deg,#d4af37,#f6d875);
    color: #111;
}


/* =========================
   OPENING SCREEN
========================= */

#home {
    position: fixed;
    inset: 0;
    z-index: 400;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(25,60,120,.55),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 60%,
            rgba(212,167,67,.12),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #071329 0%,
            #020611 100%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#home.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.home-content {
    width: 100%;
    max-width: 500px;

    text-align: center;

    padding: 30px;
}


/* =========================
   HOME LOGO
========================= */

.home-logo {
    width: min(240px, 65vw);

    display: block;
    margin: 0 auto;

    filter:
        drop-shadow(0 0 12px rgba(246,216,117,.35))
        drop-shadow(0 0 40px rgba(212,167,67,.18));

    animation:
        logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =========================
   HOME TITLE
========================= */

.home-title {
    margin-top: 35px;

    font-size: clamp(28px,8vw,44px);
    font-weight: 800;

    letter-spacing: 2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #f6d875,
            #fff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.home-subtitle {
    margin-top: 10px;

    color: rgba(255,255,255,.55);

    font-size: 13px;
    line-height: 1.6;
}


/* =========================
   GOLD LINE
========================= */

.gold-line {
    width: 100px;
    height: 1px;

    margin: 24px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            transparent
        );
}


/* =========================
   PLAY BUTTON
========================= */

.play-button {
    position: relative;

    margin-top: 22px;

    width: 190px;
    height: 58px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;

    color: #111;

    font-size: 17px;
    font-weight: 900;

    letter-spacing: 3px;

    background:
        linear-gradient(
            135deg,
            #b88a19,
            #f6d875,
            #d4af37
        );

    box-shadow:
        0 0 20px rgba(212,167,67,.25),
        0 12px 35px rgba(0,0,0,.45);

    cursor: pointer;

    animation:
        buttonPulse 2s ease-in-out infinite;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.play-button:active {
    transform: scale(.94);
}

@keyframes buttonPulse {

    0%,100% {
        box-shadow:
            0 0 20px rgba(212,167,67,.25),
            0 12px 35px rgba(0,0,0,.45);
    }

    50% {
        box-shadow:
            0 0 35px rgba(246,216,117,.5),
            0 15px 45px rgba(0,0,0,.55);
    }
}


/* =========================
   MAIN GAME
========================= */

#game {
    min-height: 100vh;

    opacity: 0;

    transition: opacity .8s ease;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(22,55,110,.45),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(212,167,67,.08),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #071126 0%,
            #020611 100%
        );
}

#game.show {
    opacity: 1;
}


/* =========================
   MAIN LOGO
========================= */

.logo-wrap {
    text-align: center;
    padding-top: 25px;
}

.logo {
    width: 145px;
    max-width: 45vw;

    display: block;
    margin: auto;

    filter:
        drop-shadow(0 0 10px rgba(212,167,67,.35));
}


/* =========================
   GAME CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 620px;

    margin: auto;

    padding: 18px 18px 40px;

    text-align: center;
}

.title {
    margin-top: 12px;

    font-size: clamp(28px,8vw,46px);
    font-weight: 800;

    letter-spacing: 1px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #f6d875,
            #fff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 8px;

    color: rgba(255,255,255,.62);

    font-size: 14px;
    line-height: 1.5;
}


/* =========================
   CARDS
========================= */

.cards {
    display: grid;
    grid-template-columns: repeat(3,1fr);

    gap: 10px;

    margin-top: 28px;
}

.card {
    position: relative;

    min-height: 235px;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(212,167,67,.28);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 15px 40px rgba(0,0,0,.35);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.card::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(212,167,67,.15),
            transparent 50%
        );
}

.card:active {
    transform: scale(.96);
}

.card.selected {
    transform: scale(1.03);

    border-color: #f6d875;

    box-shadow:
        0 0 0 1px rgba(246,216,117,.35),
        0 0 30px rgba(212,167,67,.45),
        0 20px 60px rgba(0,0,0,.6);
}

.creature-img {
    position: absolute;

    left: 50%;
    top: 5px;

    width: 125%;
    height: 175px;

    object-fit: contain;

    transform: translateX(-50%);

    filter:
        drop-shadow(0 8px 15px rgba(0,0,0,.65));

    transition:
        transform .4s ease,
        filter .4s ease;
}

.card:hover .creature-img {
    transform:
        translateX(-50%)
        scale(1.06);
}

.card.selected .creature-img {
    transform:
        translateX(-50%)
        scale(1.12);

    filter:
        drop-shadow(0 0 18px rgba(246,216,117,.65))
        drop-shadow(0 15px 25px rgba(0,0,0,.75));
}

.card-name {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 42px;

    font-size: 15px;
    font-weight: 800;
}

.card-desc {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 19px;

    color: rgba(255,255,255,.52);

    font-size: 10px;
}


/* =========================
   REVEAL
========================= */

#reveal {
    position: fixed;
    inset: 0;

    z-index: 999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(20,45,90,.55),
            rgba(0,0,0,.98) 65%
        );

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#reveal.show {
    opacity: 1;
    visibility: visible;
}

.reveal-content {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.reveal-glow {
    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(246,216,117,.55),
            rgba(212,167,67,.15) 35%,
            transparent 70%
        );

    filter: blur(5px);

    animation:
        glowPulse 1.5s infinite alternate;
}

@keyframes glowPulse {

    from {
        transform: scale(.75);
        opacity: .45;
    }

    to {
        transform: scale(1.35);
        opacity: 1;
    }
}

.ring {
    position: absolute;

    width: 100px;
    height: 100px;

    border:
        1px solid rgba(246,216,117,.55);

    border-radius: 50%;

    animation:
        ringExpand 2s ease-out infinite;
}

.ring:nth-child(2) {
    animation-delay: .4s;
}

.ring:nth-child(3) {
    animation-delay: .8s;
}

@keyframes ringExpand {

    0% {
        transform: scale(.3);
        opacity: .8;
    }

    100% {
        transform: scale(4);
        opacity: 0;
    }
}

.reveal-image {
    position: relative;

    z-index: 5;

    width: min(82vw,430px);
    height: min(58vh,430px);

    object-fit: contain;

    opacity: 0;

    transform:
        scale(.45)
        rotate(-8deg);

    filter:
        drop-shadow(0 0 30px rgba(246,216,117,.1));

    transition:
        opacity .4s ease,
        transform 1s cubic-bezier(.16,1,.3,1),
        filter 1s ease;
}

#reveal.show .reveal-image {
    opacity: 1;

    transform:
        scale(1)
        rotate(0deg);

    filter:
        drop-shadow(0 0 35px rgba(246,216,117,.65))
        drop-shadow(0 20px 40px rgba(0,0,0,.8));
}

.reveal-text {
    position: relative;

    z-index: 10;

    margin-top: -5px;

    font-size: 15px;

    color: rgba(255,255,255,.7);

    letter-spacing: 2px;

    animation:
        textPulse 1.2s infinite alternate;
}

.reveal-text.done {
    display: none;
}

@keyframes textPulse {

    from {
        opacity: .45;
    }

    to {
        opacity: 1;
    }
}

.sparkle {
    position: absolute;

    width: 3px;
    height: 3px;

    background: #f6d875;

    border-radius: 50%;

    box-shadow:
        0 0 8px #f6d875,
        0 0 15px rgba(246,216,117,.8);

    animation:
        sparkleFloat 2s linear forwards;
}

@keyframes sparkleFloat {

    0% {
        opacity: 0;
        transform:
            translateY(30px)
            scale(.4);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-180px)
            scale(1.2);
    }
}


/* =========================
   RESULT
========================= */

#result {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            rgba(15,40,80,.75),
            rgba(1,5,15,.98) 70%
        );

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

#result.show {
    opacity: 1;
    visibility: visible;
}

.result-box {
    width: min(92vw,430px);

    padding: 26px 20px 24px;

    text-align: center;

    border-radius: 26px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(246,216,117,.35);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 40px rgba(212,167,67,.12);

    backdrop-filter: blur(20px);

    transform: scale(.85);

    transition:
        transform .6s cubic-bezier(.16,1,.3,1);
}

#result.show .result-box {
    transform: scale(1);
}

.result-image {
    width: 210px;
    height: 210px;

    object-fit: contain;

    filter:
        drop-shadow(0 0 25px rgba(246,216,117,.45));
}

.result-title {
    margin-top: 5px;

    font-size: 28px;
    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            #fff,
            #f6d875,
            #fff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.result-message {
    margin-top: 10px;

    color: rgba(255,255,255,.68);

    font-size: 14px;
    line-height: 1.6;
}

.play-again {
    margin-top: 22px;

    border: 0;

    border-radius: 999px;

    padding: 13px 30px;

    font-size: 14px;
    font-weight: 800;

    color: #111;

    background:
        linear-gradient(
            135deg,
            #c99d28,
            #f6d875,
            #c99d28
        );

    box-shadow:
        0 8px 25px rgba(212,167,67,.25);

    cursor: pointer;
}

.play-again:active {
    transform: scale(.95);
}


/* =========================
   DESKTOP
========================= */

@media (min-width:700px) {

    .cards {
        gap: 18px;
    }

    .card {
        min-height: 310px;
    }

    .creature-img {
        height: 230px;
    }

    .card-name {
        bottom: 50px;
        font-size: 17px;
    }

    .card-desc {
        bottom: 25px;
        font-size: 11px;
    }
}
</style>
</head>


<body>


<!-- LANGUAGE -->

<div class="language">

    <button
        id="thBtn"
        class="active"
        onclick="setLanguage('th')">
        ไทย
    </button>

    <button
        id="enBtn"
        onclick="setLanguage('en')">
        EN
    </button>

</div>


<!-- =========================
     HOME SCREEN
========================= -->

<div id="home">

    <div class="home-content">

        <img
            class="home-logo"
            src="aura69.png"
            alt="AURA69"
        >

        <div
            class="home-title"
            id="homeTitle">
            Choose Your Luck
        </div>

        <div
            class="home-subtitle"
            id="homeSubtitle">
            เปิดโชคของคุณ
        </div>

        <div class="gold-line"></div>

        <button
            class="play-button"
            onclick="startGame()"
            id="playButton">
            PLAY
        </button>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <div class="logo-wrap">

        <img
            class="logo"
            src="aura69.png"
            alt="AURA69">

    </div>


    <div class="container">

        <div
            class="title"
            id="title">
            เลือกโชคของคุณ
        </div>

        <div
            class="subtitle"
            id="subtitle">
            เลือกหนึ่งสัญลักษณ์ แล้วเปิดคำทำนายแห่งโชคของคุณ
        </div>

        <div class="gold-line"></div>


        <div class="cards">


            <!-- DRAGON -->

            <div
                class="card"
                onclick="chooseLuck('dragon',this)">

                <img
                    class="creature-img"
                    src="dragon.png"
                    alt="Dragon">

                <div
                    class="card-name"
                    data-th="มังกร"
                    data-en="Dragon">
                    มังกร
                </div>

                <div
                    class="card-desc"
                    data-th="พลัง • อำนาจ"
                    data-en="Power • Strength">
                    พลัง • อำนาจ
                </div>

            </div>


            <!-- QILIN -->

            <div
                class="card"
                onclick="chooseLuck('qilin',this)">

                <img
                    class="creature-img"
                    src="qilin.png"
                    alt="Qilin">

                <div
                    class="card-name"
                    data-th="กิเลน"
                    data-en="Qilin">
                    กิเลน
                </div>

                <div
                    class="card-desc"
                    data-th="โชคลาภ • สิริมงคล"
                    data-en="Prosperity • Fortune">
                    โชคลาภ • สิริมงคล
                </div>

            </div>


            <!-- TOAD -->

            <div
                class="card"
                onclick="chooseLuck('toad',this)">

                <img
                    class="creature-img"
                    src="toad.png"
                    alt="Golden Toad">

                <div
                    class="card-name"
                    data-th="คางคกทอง"
                    data-en="Golden Toad">
                    คางคกทอง
                </div>

                <div
                    class="card-desc"
                    data-th="ทรัพย์ • ความมั่งคั่ง"
                    data-en="Wealth • Abundance">
                    ทรัพย์ • ความมั่งคั่ง
                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     REVEAL
========================= -->

<div id="reveal">

    <div class="reveal-content">

        <div class="reveal-glow"></div>

        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>

        <img
            id="revealImage"
            class="reveal-image"
            src=""
            alt="">

        <div
            id="revealText"
            class="reveal-text">
            กำลังเปิดโชคของคุณ...
        </div>

    </div>

</div>


<!-- =========================
     RESULT
========================= -->

<div id="result">

    <div class="result-box">

        <img
            id="resultImage"
            class="result-image"
            src=""
            alt="">

        <div
            id="resultTitle"
            class="result-title">
            โชคของคุณ
        </div>

        <div
            id="resultMessage"
            class="result-message">
        </div>

        <button
            class="play-again"
            onclick="playAgain()"
            id="playAgain">
            เล่นอีกครั้ง
        </button>

    </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

if (window.Telegram && Telegram.WebApp) {

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

}


/* =========================
   LANGUAGE
========================= */

let currentLanguage = "th";


function setLanguage(lang) {

    currentLanguage = lang;


    document
        .getElementById("thBtn")
        .classList
        .toggle("active", lang === "th");


    document
        .getElementById("enBtn")
        .classList
        .toggle("active", lang === "en");


    if (lang === "th") {

        document.getElementById("homeTitle")
            .textContent = "เลือกโชคของคุณ";

        document.getElementById("homeSubtitle")
            .textContent = "เปิดโชคของคุณ";

        document.getElementById("title")
            .textContent = "เลือกโชคของคุณ";

        document.getElementById("subtitle")
            .textContent =
            "เลือกหนึ่งสัญลักษณ์ แล้วเปิดคำทำนายแห่งโชคของคุณ";

        document.getElementById("playAgain")
            .textContent = "เล่นอีกครั้ง";

    } else {

        document.getElementById("homeTitle")
            .textContent = "Choose Your Luck";

        document.getElementById("homeSubtitle")
            .textContent = "Reveal your fortune";

        document.getElementById("title")
            .textContent = "Choose Your Luck";

        document.getElementById("subtitle")
            .textContent =
            "Choose one symbol and reveal your fortune";

        document.getElementById("playAgain")
            .textContent = "Play Again";

    }


    document
        .querySelectorAll("[data-th]")
        .forEach(el => {

            el.textContent =
                lang === "th"
                    ? el.dataset.th
                    : el.dataset.en;

        });

}


/* =========================
   START GAME
========================= */

function startGame() {

    const home =
        document.getElementById("home");

    const game =
        document.getElementById("game");


    home.classList.add("hide");


    setTimeout(() => {

        game.classList.add("show");

    }, 250);

}


/* =========================
   GAME DATA
========================= */

const luckData = {

    dragon: {

        image: "dragon.png",

        th: {
            title: "มังกรแห่งพลัง",
            message:
            "พลังและความกล้ากำลังเปิดทางให้คุณ ก้าวไปข้างหน้าด้วยความมั่นใจ และอย่ากลัวที่จะเลือกสิ่งที่ยิ่งใหญ่"
        },

        en: {
            title: "Dragon of Power",
            message:
            "Power and courage are opening a new path for you. Move forward with confidence and embrace bold choices."
        }

    },


    qilin: {

        image: "qilin.png",

        th: {
            title: "กิเลนแห่งสิริมงคล",
            message:
            "พลังแห่งความสงบและโชคดีอยู่รอบตัวคุณ จังหวะใหม่กำลังเข้ามา เปิดใจรับโอกาสที่กำลังเกิดขึ้น"
        },

        en: {
            title: "Qilin of Fortune",
            message:
            "A peaceful energy surrounds you. A new opportunity may be closer than you think. Stay open and trust your timing."
        }

    },


    toad: {

        image: "toad.png",

        th: {
            title: "คางคกทองแห่งทรัพย์",
            message:
            "สัญลักษณ์แห่งความมั่งคั่งกำลังส่งพลังให้คุณ มองเห็นคุณค่าของโอกาสเล็ก ๆ และเปลี่ยนมันให้กลายเป็นสิ่งที่ยิ่งใหญ่"
        },

        en: {
            title: "Golden Toad of Wealth",
            message:
            "The energy of abundance surrounds you. Notice the small opportunities around you and turn them into something meaningful."
        }

    }

};


let isPlaying = false;


/* =========================
   CHOOSE LUCK
========================= */

function chooseLuck(type, card) {

    if (isPlaying) return;

    isPlaying = true;


    document
        .querySelectorAll(".card")
        .forEach(c =>
            c.classList.remove("selected")
        );


    card.classList.add("selected");


    const data =
        luckData[type];


    const reveal =
        document.getElementById("reveal");

    const revealImage =
        document.getElementById("revealImage");

    const revealText =
        document.getElementById("revealText");


    revealImage.src =
        data.image;


    revealText.classList.remove("done");


    revealText.textContent =
        currentLanguage === "th"
            ? "กำลังเปิดโชคของคุณ..."
            : "Revealing your luck...";


    createSparkles();


    reveal.classList.add("show");


    setTimeout(() => {

        revealText.classList.add("done");

    },1200);


    setTimeout(() => {

        showResult(type);

    },2400);

}


/* =========================
   SPARKLES
========================= */

function createSparkles() {

    const container =
        document.querySelector(".reveal-content");


    for(let i=0;i<28;i++) {

        const sparkle =
            document.createElement("div");


        sparkle.className =
            "sparkle";


        sparkle.style.left =
            Math.random()*100 + "%";


        sparkle.style.top =
            (45 + Math.random()*40) + "%";


        sparkle.style.animationDelay =
            Math.random()*.9 + "s";


        sparkle.style.animationDuration =
            (1.2 + Math.random()*1.4) + "s";


        container.appendChild(sparkle);


        setTimeout(() => {

            sparkle.remove();

        },3000);

    }

}


/* =========================
   RESULT
========================= */

function showResult(type) {

    const data =
        luckData[type];


    const reveal =
        document.getElementById("reveal");


    const result =
        document.getElementById("result");


    const resultImage =
        document.getElementById("resultImage");


    const resultTitle =
        document.getElementById("resultTitle");


    const resultMessage =
        document.getElementById("resultMessage");


    resultImage.src =
        data.image;


    resultTitle.textContent =
        currentLanguage === "th"
            ? data.th.title
            : data.en.title;


    resultMessage.textContent =
        currentLanguage === "th"
            ? data.th.message
            : data.en.message;


    reveal.classList.remove("show");


    setTimeout(() => {

        result.classList.add("show");

    },350);

}


/* =========================
   PLAY AGAIN
========================= */

function playAgain() {

    document
        .getElementById("result")
        .classList
        .remove("show");


    document
        .querySelectorAll(".card")
        .forEach(c =>
            c.classList.remove("selected")
        );


    isPlaying = false;

}

</script>
