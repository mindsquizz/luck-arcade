<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AURA69 — Choose Your Luck</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#020817;
  color:white;
}

body{
  background:
    radial-gradient(circle at 50% 20%,rgba(23,62,120,.35),transparent 45%),
    radial-gradient(circle at 50% 100%,rgba(212,166,58,.12),transparent 45%),
    #020817;
}

/* =========================
   GLOBAL
========================= */

.screen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.hidden{
  display:none!important;
}

/* =========================
   LANGUAGE
========================= */

.lang{
  position:absolute;
  top:18px;
  right:18px;
  z-index:50;

  border:1px solid rgba(255,215,120,.35);
  background:rgba(4,12,28,.75);
  backdrop-filter:blur(12px);

  color:#f4d47b;
  padding:8px 13px;
  border-radius:20px;

  font-size:12px;
  letter-spacing:.5px;
}

/* =========================
   SOUND BUTTON
========================= */

.sound{
  position:absolute;
  top:18px;
  left:18px;
  z-index:50;

  width:38px;
  height:38px;

  border-radius:50%;

  border:1px solid rgba(255,215,120,.3);
  background:rgba(4,12,28,.75);
  backdrop-filter:blur(12px);

  color:#f4d47b;
  font-size:17px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   OPENING
========================= */

#opening{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    radial-gradient(circle at center,
      rgba(35,79,145,.28),
      transparent 42%),
    #020817;
}

.openGlow{
  position:absolute;
  width:280px;
  height:280px;

  background:radial-gradient(
    circle,
    rgba(226,181,67,.22),
    transparent 70%
  );

  filter:blur(15px);

  animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.9);
    opacity:.6;
  }

  50%{
    transform:scale(1.15);
    opacity:1;
  }
}

.openLogo{
  position:relative;
  width:min(70vw,330px);

  filter:
    drop-shadow(0 0 15px rgba(220,170,50,.35))
    drop-shadow(0 0 40px rgba(220,170,50,.15));

  animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }
}

.openTitle{
  margin-top:25px;

  font-size:12px;
  letter-spacing:4px;

  color:#d7b95e;
  text-transform:uppercase;
}

.playBtn{
  position:relative;

  margin-top:35px;

  min-width:180px;
  padding:16px 30px;

  border-radius:30px;

  border:1px solid rgba(255,224,139,.8);

  background:
    linear-gradient(
      135deg,
      #e9c866,
      #b98722
    );

  color:#08101e;

  font-weight:bold;
  font-size:16px;

  box-shadow:
    0 0 25px rgba(225,183,67,.25),
    inset 0 1px rgba(255,255,255,.45);

  transition:.2s;
}

.playBtn:active{
  transform:scale(.94);
}

/* =========================
   GAME
========================= */

#game{
  padding:65px 18px 20px;

  display:flex;
  flex-direction:column;
  align-items:center;

  overflow:auto;
}

.header{
  text-align:center;
  margin-top:5px;
}

.brand{
  color:#d8b85d;
  font-size:11px;
  letter-spacing:5px;
  margin-bottom:12px;
}

.title{
  font-size:28px;
  font-weight:700;
  margin:0;

  background:
    linear-gradient(
      90deg,
      #f9df8b,
      #fff5c7,
      #d9ad42
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:9px;
  font-size:13px;
  color:#94a4bd;
}

.cards{
  width:100%;
  max-width:430px;

  display:flex;
  flex-direction:column;
  gap:13px;

  margin-top:28px;
}

.card{
  position:relative;

  min-height:115px;

  border-radius:22px;

  overflow:hidden;

  border:1px solid rgba(220,185,90,.18);

  background:
    linear-gradient(
      135deg,
      rgba(18,37,70,.95),
      rgba(5,15,31,.98)
    );

  box-shadow:
    0 12px 30px rgba(0,0,0,.28);

  display:flex;
  align-items:center;

  padding:10px;

  transition:
    transform .25s,
    border .25s,
    box-shadow .25s;
}

.card:active{
  transform:scale(.97);
}

.card::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,215,120,.06),
      transparent
    );

  transform:translateX(-100%);
}

.card:hover::after{
  animation:shine .8s;
}

@keyframes shine{
  to{
    transform:translateX(100%);
  }
}

.creature{
  position:relative;
  z-index:2;

  width:105px;
  height:95px;

  object-fit:contain;

  filter:
    drop-shadow(0 0 10px rgba(230,190,70,.2));

  transition:.3s;
}

.card:hover .creature{
  transform:scale(1.06);
}

.info{
  position:relative;
  z-index:2;

  padding-left:12px;
  flex:1;
}

.name{
  font-size:18px;
  font-weight:bold;

  color:#f5d477;
}

.en{
  font-size:10px;
  color:#8291aa;
  margin-top:3px;
  letter-spacing:1px;
}

.meaning{
  font-size:12px;
  color:#d7dfeb;
  margin-top:9px;
  line-height:1.4;
}

.choose{
  margin-top:24px;

  color:#65758f;

  font-size:11px;
  letter-spacing:1px;
}

/* =========================
   REVEAL
========================= */

#reveal{
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(31,73,138,.55),
      rgba(2,8,23,.97) 65%
    );

  opacity:1;
}

.revealGlow{
  position:absolute;

  width:380px;
  height:380px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(242,197,82,.30),
      transparent 68%
    );

  animation:revealPulse 1.4s ease-in-out infinite;
}

@keyframes revealPulse{

  0%,100%{
    transform:scale(.75);
    opacity:.5;
  }

  50%{
    transform:scale(1.25);
    opacity:1;
  }
}

.ring{
  position:absolute;

  width:220px;
  height:220px;

  border-radius:50%;

  border:1px solid rgba(241,202,92,.4);

  animation:ringExpand 2s ease-out infinite;
}

.ring.two{
  animation-delay:.5s;
}

@keyframes ringExpand{

  0%{
    transform:scale(.4);
    opacity:.9;
  }

  100%{
    transform:scale(2);
    opacity:0;
  }
}

.revealContent{
  position:relative;
  z-index:5;

  text-align:center;

  width:100%;
}

.revealText{
  font-size:13px;
  letter-spacing:2px;

  color:#e6cb78;

  margin-bottom:25px;
}

.revealImg{
  width:min(72vw,330px);
  height:330px;

  object-fit:contain;

  filter:
    drop-shadow(0 0 20px rgba(244,204,89,.45));

  animation:
    revealCharacter 1.8s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes revealCharacter{

  0%{
    transform:
      scale(.15)
      rotate(-12deg);

    opacity:0;
    filter:
      blur(18px)
      drop-shadow(0 0 0 transparent);
  }

  45%{
    opacity:.7;
  }

  75%{
    transform:
      scale(1.12)
      rotate(4deg);

    filter:
      blur(0)
      drop-shadow(0 0 35px rgba(244,204,89,.75));
  }

  100%{
    transform:
      scale(1)
      rotate(0deg);

    opacity:1;

    filter:
      blur(0)
      drop-shadow(0 0 20px rgba(244,204,89,.45));
  }
}

.revealMessage{
  margin-top:15px;

  font-size:18px;
  font-weight:bold;

  color:#fff0b1;

  opacity:0;

  animation:
    messageIn .6s ease 1.45s forwards;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   RESULT
========================= */

#result{
  z-index:90;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  background:
    radial-gradient(
      circle at center,
      rgba(18,52,102,.5),
      #020817 70%
    );
}

.resultBox{
  width:100%;
  max-width:380px;

  text-align:center;

  padding:30px 20px;

  border-radius:28px;

  border:1px solid rgba(237,199,91,.35);

  background:
    linear-gradient(
      145deg,
      rgba(17,34,63,.96),
      rgba(3,11,25,.98)
    );

  box-shadow:
    0 25px 70px rgba(0,0,0,.5),
    0 0 45px rgba(217,175,67,.1);
}

.resultImg{
  width:210px;
  height:210px;

  object-fit:contain;

  filter:
    drop-shadow(0 0 25px rgba(236,197,80,.45));

  animation:resultFloat 3s ease-in-out infinite;
}

@keyframes resultFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }
}

.resultTitle{
  font-size:25px;
  color:#f5d477;

  margin-top:5px;
}

.resultSub{
  color:#9eabc0;
  font-size:12px;
  margin-top:6px;
}

.resultMeaning{
  margin-top:15px;

  color:#e4e9f2;

  font-size:13px;
  line-height:1.6;
}

.again{
  margin-top:25px;

  width:100%;

  padding:15px;

  border-radius:25px;

  border:1px solid rgba(239,205,104,.6);

  background:transparent;

  color:#f1cf70;

  font-weight:bold;

  font-size:14px;

  transition:.2s;
}

.again:active{
  transform:scale(.96);
  background:rgba(230,190,80,.08);
}

/* =========================
   PARTICLES
========================= */

.particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#f0cf70;

  box-shadow:0 0 8px #f0cf70;

  pointer-events:none;

  animation:particleMove 2s linear forwards;
}

@keyframes particleMove{

  from{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  to{
    transform:translateY(-160px) scale(0);
    opacity:0;
  }
}

</style>
</head>

<body>

<script>

/* ==========================================
   TELEGRAM
========================================== */

const tg = window.Telegram?.WebApp;

if(tg){

  tg.ready();

  tg.expand();

}


/* ==========================================
   AUDIO ENGINE
   No external files needed
========================================== */

let audioCtx = null;

let soundEnabled = true;


function initAudio(){

  try{

    if(!audioCtx){

      audioCtx =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

    if(audioCtx.state === "suspended"){

      audioCtx.resume();

    }

  }catch(e){

    console.log("Audio unavailable");

  }

}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.05,
  delay=0
){

  if(!soundEnabled || !audioCtx) return;

  try{

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.type = type;

    osc.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      0,
      audioCtx.currentTime + delay
    );

    gain.gain.linearRampToValueAtTime(
      volume,
      audioCtx.currentTime + delay + .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + delay + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(
      audioCtx.currentTime + delay
    );

    osc.stop(
      audioCtx.currentTime +
      delay +
      duration +
      .03
    );

  }catch(e){}

}


/* ==========================================
   SOUND EFFECTS
========================================== */

function tapSound(){

  tone(
    620,
    .08,
    "sine",
    .045
  );

  tone(
    880,
    .07,
    "sine",
    .025,
    .035
  );

}


function revealSound(){

  tone(
    260,
    .35,
    "sine",
    .04
  );

  tone(
    330,
    .35,
    "sine",
    .04,
    .12
  );

  tone(
    440,
    .4,
    "sine",
    .045,
    .24
  );

  tone(
    660,
    .5,
    "triangle",
    .055,
    .38
  );

}


function successSound(){

  tone(
    523,
    .28,
    "sine",
    .045
  );

  tone(
    659,
    .28,
    "sine",
    .045,
    .08
  );

  tone(
    784,
    .45,
    "sine",
    .05,
    .16
  );

  tone(
    1046,
    .55,
    "triangle",
    .04,
    .28
  );

}


/* ==========================================
   HAPTIC
========================================== */

function haptic(type="light"){

  try{

    if(
      tg &&
      tg.HapticFeedback
    ){

      if(type === "success"){

        tg.HapticFeedback
          .notificationOccurred(
            "success"
          );

      }else{

        tg.HapticFeedback
          .impactOccurred(
            type
          );

      }

    }

  }catch(e){}

}


/* ==========================================
   LANGUAGE
========================================== */

let thai = true;


const translations = {

  th:{
    title:"เลือกโชคของคุณ",
    subtitle:"เลือกหนึ่งสัญลักษณ์เพื่อเปิดโชค",
    choose:"เลือกหนึ่ง",
    reveal:"กำลังเปิดโชคของคุณ...",
    revealMessage:"✨ โชคกำลังเปิด ✨",
    again:"เล่นอีกครั้ง",

    dragon:{
      title:"มังกร",
      en:"DRAGON",
      meaning:"พลัง อำนาจ และความมั่งคั่ง",
      result:"โชคแห่งพลัง"
    },

    qilin:{
      title:"กิเลน",
      en:"QILIN",
      meaning:"โชคดี ความเจริญรุ่งเรือง",
      result:"โชคแห่งความรุ่งเรือง"
    },

    toad:{
      title:"คางคกทอง",
      en:"GOLDEN TOAD",
      meaning:"เงินทอง ความมั่งคั่ง",
      result:"โชคแห่งความมั่งคั่ง"
    }

  },

  en:{
    title:"Choose Your Luck",
    subtitle:"Choose one symbol to reveal your luck",
    choose:"CHOOSE ONE",
    reveal:"REVEALING YOUR LUCK...",
    revealMessage:"✨ YOUR LUCK IS OPENING ✨",
    again:"PLAY AGAIN",

    dragon:{
      title:"Dragon",
      en:"DRAGON",
      meaning:"Power, fortune & wealth",
      result:"Luck of Power"
    },

    qilin:{
      title:"Qilin",
      en:"QILIN",
      meaning:"Prosperity, fortune & harmony",
      result:"Luck of Prosperity"
    },

    toad:{
      title:"Golden Toad",
      en:"GOLDEN TOAD",
      meaning:"Wealth, money & abundance",
      result:"Luck of Wealth"
    }

  }

};


function updateLanguage(){

  const t =
    thai
      ? translations.th
      : translations.en;

  document.getElementById("title")
    .textContent = t.title;

  document.getElementById("subtitle")
    .textContent = t.subtitle;

  document.getElementById("chooseText")
    .textContent = t.choose;

  document.getElementById("revealText")
    .textContent = t.reveal;

  document.getElementById("revealMessage")
    .textContent = t.revealMessage;

  document.getElementById("againBtn")
    .textContent = t.again;


  const cards =
    document.querySelectorAll(".card");

  cards.forEach(card=>{

    const choice =
      card.dataset.choice;

    const data =
      t[choice];

    card.querySelector(".name")
      .textContent =
      choice === "dragon"
        ? (thai ? "🐉 มังกร" : "🐉 Dragon")
        : choice === "qilin"
        ? (thai ? "🦌 กิเลน" : "🦌 Qilin")
        : (thai ? "🐸 คางคกทอง" : "🐸 Golden Toad");

    card.querySelector(".en")
      .textContent = data.en;

    card.querySelector(".meaning")
      .textContent = data.meaning;

  });

}


/* ==========================================
   SCREENS
========================================== */

const opening =
  document.getElementById("opening");

const game =
  document.getElementById("game");

const reveal =
  document.getElementById("reveal");

const result =
  document.getElementById("result");


function showScreen(screen){

  [
    opening,
    game,
    reveal,
    result
  ].forEach(x =>
    x.classList.add("hidden")
  );

  screen.classList.remove("hidden");

}


/* ==========================================
   PARTICLES
========================================== */

function particles(){

  for(let i=0;i<28;i++){

    const p =
      document.createElement("div");

    p.className="particle";

    p.style.left =
      Math.random()*100+"%";

    p.style.top =
      (45 + Math.random()*45)+"%";

    p.style.animationDelay =
      Math.random()*.8+"s";

    p.style.animationDuration =
      (1.4+Math.random()*1.3)+"s";

    reveal.appendChild(p);

    setTimeout(
      ()=>p.remove(),
      3000
    );

  }

}

   PLAY
========================================== */

document
  .getElementById("playBtn")
  .addEventListener("click",()=>{

    initAudio();

    tapSound();

    haptic("light");

    showScreen(game);

  });

========================================== */

function toggleSound(){

  soundEnabled =
    !soundEnabled;

  const icon =
    soundEnabled
      ? "🔊"
      : "🔇";

  document
    .getElementById("soundBtn")
    .textContent = icon;

  document
    .getElementById("gameSoundBtn")
    .textContent = icon;

  if(soundEnabled){

    initAudio();

    tone(
      700,
      .1,
      "sine",
      .04
    );

  }

}

  .getElementById("soundBtn")
  .addEventListener(

  );

  .getElementById("gameSoundBtn")

  );

/* ==========================================
   RESULT
========================================== */

function showResult(choice){

  const t =
    thai
      ? translations.th
      : translations.en;

  const data =
    t[choice];

  document
    .getElementById("resultImg")
    .src =
    gameData[choice].image;

  document
    .getElementById("resultTitle")
    .textContent =
    data.result;

  document
    .getElementById("resultSub")
    .textContent =
    data.en;

  document
    .getElementById("resultMeaning")
    .textContent =
    data.meaning;


  showScreen(result);

}
