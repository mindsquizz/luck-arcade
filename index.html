<style>

/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{

  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;

  font-family:

/* =========================================
   SCREENS
========================================= */

  inset:0;

  height:100%;
}

.hidden{

/* =========================================

========================================= */

========================================= */

  right:17px;

}

  left:17px;

  height:38px;

  color:#e8c968;

  display:flex;

  justify-content:center;

}


/* =========================================
   OPENING SCREEN
========================================= */

#opening{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(28,67,128,.26),
      transparent 48%
    ),
    #020817;
}

.openGlow{
  position:absolute;

  width:310px;
  height:310px;

  border-radius:50%;

    radial-gradient(
      circle,
      rgba(224,180,67,.22),
      transparent 68%
    );

}

@keyframes openPulse{

  0%,100%{
    transform:scale(.88);
    opacity:.55;
  }

  50%{
    transform:scale(1.16);
    opacity:1;
  }
}

.openLogo{

}

@keyframes logoFloat{

  }

  }
}

.openTitle{
  position:relative;
  z-index:2;

  margin-top:22px;

  color:#d9bc63;

  font-size:13px;

  letter-spacing:2px;
}

.playBtn{

  z-index:2;

  margin-top:34px;

  min-width:190px;

  padding:16px 34px;

  border-radius:30px;

  border:1px solid rgba(255,228,145,.8);

  background:
    linear-gradient(
      135deg,

    );

  color:#07101e;

  font-size:16px;
  font-weight:bold;

    inset 0 1px rgba(255,255,255,.55);

  transition:.2s;
}

.playBtn:active{
  transform:scale(.94);
}


/* =========================================
   GAME SCREEN
========================================= */

#game{

  padding:
    65px
    18px
    20px;

  overflow:auto;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(27,66,128,.24),
      transparent 45%
    ),
    #020817;
}


/* HEADER */

.header{
  width:100%;
  text-align:center;

  margin-top:5px;
}

.brand{
  color:#d9b95e;

  letter-spacing:6px;

  margin-bottom:10px;
}

.title{

  font-size:28px;

      #fff5c9,

  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:9px;

  color:#8999b2;

  font-size:12px;
}


/* =========================================
   LARGE CHARACTER CARDS
========================================= */

.cards{

  width:100%;
  max-width:430px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  margin-top:28px;
}


/* LARGE CARD */

.card{

  position:relative;

  min-height:205px;

  overflow:hidden;

  border-radius:24px;

  border:
    1px solid
    rgba(221,184,76,.20);

  background:
    linear-gradient(
      145deg,
      rgba(20,43,79,.95),
      rgba(3,13,29,.98)
    );

  box-shadow:
    0 15px 35px rgba(0,0,0,.32);

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:flex-end;

  padding:
    10px
    8px
    18px;

  transition:
    transform .22s ease,
    border .22s ease,
    box-shadow .22s ease;
}


/* GOLD SHINE */

.card::before{

  content:"";

  position:absolute;

  top:-60%;
  left:-80%;

  width:60%;
  height:220%;

  transform:rotate(25deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,226,132,.10),
      transparent
    );

  transition:.7s;
}

.card:hover::before{
  left:140%;
}


/* TOP GLOW */

.card::after{

  content:"";

  position:absolute;

  top:0;
  left:10%;
  right:10%;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(245,211,116,.55),
      transparent
    );
}


/* ACTIVE */

.card:active{

  transform:scale(.95);

  border-color:
    rgba(242,203,91,.7);

  box-shadow:
    0 0 35px rgba(225,182,63,.18);
}


/* CHARACTER IMAGE */

.creature{

  position:absolute;

  top:7px;

  left:50%;

  transform:
    translateX(-50%);

  width:165px;
  height:165px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 0 13px
      rgba(235,193,73,.25)
    );

  transition:
    transform .3s ease,
    filter .3s ease;
}

.card:active .creature{

  transform:
    translateX(-50%)
    scale(1.05);

  filter:
    drop-shadow(
      0 0 23px
      rgba(240,202,85,.55)

    filter:
      blur(18px)

  }

      rotate(4deg);

      blur(0)
      drop-shadow(

  100%{

    transform:
      scale(1)
      rotate(0);

    opacity:1;

    filter:
      blur(0)

        rgba(244,204,89,.48)

  }
}

/* =========================================
   PARTICLES
========================================= */

.particle{

@keyframes particleMove{

</style>

<script>

/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp;

if(tg){

  tg.ready();

  tg.expand();

}


/* =========================================
   AUDIO
========================================= */

let audioCtx = null;

let soundEnabled = true;


function initAudio(){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioCtx.state === "suspended"
    ){

      audioCtx.resume();

    }

  }catch(e){

    console.log(
      "Audio unavailable"
    );

  }

}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.05,
  delay=0
){

  if(
    !soundEnabled ||
    !audioCtx
  ){

    return;

  }

  try{

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();


    osc.type = type;

    osc.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      0,
      audioCtx.currentTime + delay
    );

    gain.gain.linearRampToValueAtTime(
      volume,
      audioCtx.currentTime +
      delay +
      .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime +
      delay +
      duration
    );


    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );


    osc.start(
      audioCtx.currentTime +
      delay
    );

    osc.stop(
      audioCtx.currentTime +
      delay +
      duration +
      .03
    );

  }catch(e){}

}


/* =========================================
   SOUND EFFECTS
========================================= */

function tapSound(){

  tone(
    620,
    .08,
    "sine",
    .045
  );

  tone(
    880,
    .07,
    "sine",
    .025,
    .035
  );

}


function revealSound(){

  tone(
    260,
    .35,
    "sine",
    .04
  );

  tone(
    330,
    .35,
    "sine",
    .04,
    .12
  );

  tone(
    440,
    .4,
    "sine",
    .045,
    .24
  );

  tone(
    660,
    .5,
    "triangle",
    .055,
    .38
  );

}


function successSound(){

  tone(
    523,
    .28,
    "sine",
    .045
  );

  tone(
    659,
    .28,
    "sine",
    .045,
    .08
  );

  tone(
    784,
    .45,
    "sine",
    .05,
    .16
  );

  tone(
    1046,
    .55,
    "triangle",
    .04,
    .28
  );

}


/* =========================================
   TELEGRAM HAPTIC
========================================= */

function haptic(type="light"){

  try{

    if(
      tg &&
      tg.HapticFeedback
    ){

      if(
        type === "success"
      ){

        tg.HapticFeedback
          .notificationOccurred(
            "success"
          );

      }else{

        tg.HapticFeedback
          .impactOccurred(
            type
          );

      }

    }

  }catch(e){}

}


/* =========================================
   LANGUAGE
========================================= */

    reveal:
      "กำลังเปิดโชคของคุณ...",

    revealMessage:
      "✨ โชคกำลังเปิด ✨",

    again:
      "เล่นอีกครั้ง",


    dragon:{
      title:"🐉 มังกร",
      en:"DRAGON",
      meaning:"พลัง อำนาจ และความมั่งคั่ง",
      result:"โชคแห่งพลัง"

    qilin:{

      en:"QILIN",
      meaning:"โชคดี และความเจริญรุ่งเรือง",
      result:"โชคแห่งความรุ่งเรือง"
    },

    toad:{
      title:"🐸 คางคกทอง",
      en:"GOLDEN TOAD",
      meaning:"เงินทอง และความมั่งคั่ง",
      result:"โชคแห่งความมั่งคั่ง"
    }

  },


  en:{

    openTitle:
      "Choose Your Luck",

    play:
      "PLAY",

    title:
      "Choose Your Luck",

    subtitle:
      "Choose one symbol to reveal your luck",

    choose:
      "CHOOSE ONE",

    reveal:
      "REVEALING YOUR LUCK...",

    revealMessage:
      "✨ YOUR LUCK IS OPENING ✨",

    again:
      "PLAY AGAIN",


    dragon:{
      title:"🐉 Dragon",
      en:"DRAGON",
      meaning:"Power, fortune & wealth",
      result:"Luck of Power"
    },

    qilin:{
      title:"🦌 Qilin",
      en:"QILIN",
      meaning:"Prosperity, fortune & harmony",
      result:"Luck of Prosperity"
    },

      meaning:"Wealth, money & abundance",
      result:"Luck of Wealth"
    }

  }

};


/* =========================================
   UPDATE LANGUAGE
========================================= */

function updateLanguage(){

  const t =
    thai
      ? translations.th
      : translations.en;


  document
    .getElementById("openTitle")
    .textContent =
      t.openTitle;


  document
    .getElementById("playBtn")
    .textContent =
      t.play;


  document
    .getElementById("title")
    .textContent =
      t.title;


  document
    .getElementById("subtitle")
    .textContent =
      t.subtitle;


  document
    .getElementById("chooseText")
    .textContent =
      t.choose;


  document
    .getElementById("revealText")
    .textContent =
      t.reveal;


  document
    .getElementById("revealMessage")
    .textContent =
      t.revealMessage;


  document
    .getElementById("againBtn")
    .textContent =
      t.again;


  document
    .querySelectorAll(".card")
    .forEach(card=>{

      const choice =
        card.dataset.choice;

      const data =
        t[choice];


      card
        .querySelector(".name")
        .textContent =
          data.title;


      card
        .querySelector(".en")
        .textContent =
          data.en;


      card
        .querySelector(".meaning")
        .textContent =
          data.meaning;

    });

}


/* =========================================
   SCREEN CONTROL
========================================= */

const opening =
  document.getElementById(
    "opening"
  );

const game =
  document.getElementById(
    "game"
  );

const reveal =
  document.getElementById(
    "reveal"
  );

const result =
  document.getElementById(
    "result"
  );


function showScreen(screen){

  [
    opening,
    game,
    reveal,
    result
  ].forEach(
    x =>
      x.classList.add(
        "hidden"
      )
  );

  screen.classList.remove(
    "hidden"
  );

}


/* =========================================
   PARTICLES
========================================= */

function particles(){

  for(
    let i=0;
    i<32;
    i++
  ){

    const p =
      document.createElement(
        "div"
      );


    p.className =
      "particle";


    p.style.left =
      Math.random()*100 +
      "%";


    p.style.top =
      (
        45 +
        Math.random()*45
      ) +
      "%";


    p.style.animationDelay =
      Math.random()*.8 +
      "s";


    p.style.animationDuration =
      (
        1.4 +
        Math.random()*1.3
      ) +
      "s";


    reveal.appendChild(p);


    setTimeout(
      ()=>p.remove(),
      3000
    );

  }

}


/* =========================================
   PLAY
========================================= */

document
  .getElementById("playBtn")
  .addEventListener(
    "click",
    ()=>{

      initAudio();

      tapSound();

      haptic("light");

      showScreen(game);

    }
  );


/* =========================================
   LANGUAGE
========================================= */

function toggleLanguage(){

  thai = !thai;

  updateLanguage();

  initAudio();

  tapSound();

}


document
  .getElementById("langBtn")
  .addEventListener(
    "click",
    toggleLanguage
  );


document
  .getElementById("gameLangBtn")
  .addEventListener(
    "click",
    toggleLanguage
  );


/* =========================================
   SOUND BUTTON
========================================= */

function toggleSound(){

  soundEnabled =
    !soundEnabled;


  const icon =
    soundEnabled
      ? "🔊"
      : "🔇";


  document
    .getElementById(
      "soundBtn"
    )
    .textContent =
      icon;


  document
    .getElementById(
      "gameSoundBtn"
    )
    .textContent =
      icon;


  if(soundEnabled){

    initAudio();

    tone(
      700,
      .1,
      "sine",
      .04
    );

  }

}


document
  .getElementById(
    "soundBtn"
  )
  .addEventListener(
    "click",
    toggleSound
  );


document
  .getElementById(
    "gameSoundBtn"
  )
  .addEventListener(
    "click",
    toggleSound
  );


/* =========================================
   GAME DATA
========================================= */

const gameData = {

  dragon:{
    image:"dragon.png"
  },

  qilin:{
    image:"qilin.png"
  },

  toad:{
    image:"toad.png"
  }

};


/* =========================================
   CHARACTER SELECTION
========================================= */

document
  .querySelectorAll(".card")
  .forEach(card=>{

    card.addEventListener(
      "click",
      ()=>{

        initAudio();


        const choice =
          card.dataset.choice;


        tapSound();

        haptic("medium");


        const data =
          gameData[choice];


        document
          .getElementById(
            "revealImg"
          )
          .src =
            data.image;


        document
          .getElementById(
            "revealImg"
          )
          .alt =
            choice;


        showScreen(reveal);


        particles();


        revealSound();


        setTimeout(
          ()=>{

            successSound();

            haptic(
              "success"
            );

          },
          1300
        );


        setTimeout(
          ()=>{
            showResult(
              choice
            );
          },
          2700
        );

      }
    );

  });


/* =========================================
   RESULT
========================================= */

function showResult(choice){

  const t =
    thai
      ? translations.th
      : translations.en;


  const data =
    t[choice];


  document
    .getElementById(
      "resultImg"
    )
    .src =
      gameData[
        choice
      ].image;


  document
    .getElementById(
      "resultTitle"
    )
    .textContent =
      data.result;


  document
    .getElementById(
      "resultSub"
    )
    .textContent =
      data.en;


  document
    .getElementById(
      "resultMeaning"
    )
    .textContent =
      data.meaning;


  showScreen(result);

}


/* =========================================
   PLAY AGAIN
========================================= */

document
  .getElementById(
    "againBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      initAudio();

      tapSound();

      haptic("light");

      showScreen(game);

    }
  );


/* =========================================
   START
========================================= */

updateLanguage();

</script>
